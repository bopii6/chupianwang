<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>账号管理 · 出片王</title>
  <link rel="icon" href="/favicon.svg" />
  <link rel="stylesheet" href="/admin/accounts.css" />
  <style>
    /* 三个标签页：账号 / 客户在问什么 / 出错记录 */
    .admin-tabs { display: flex; gap: 6px; margin: 0 0 18px; border-bottom: 1px solid #e6e1d8; flex-wrap: wrap; }
    .admin-tabs button {
      appearance: none; border: 0; background: none; cursor: pointer;
      font: inherit; font-size: 15px; color: #6b6560; padding: 10px 14px 12px;
      border-bottom: 2px solid transparent; margin-bottom: -1px;
    }
    .admin-tabs button:hover { color: #1d1a17; }
    .admin-tabs button.on { color: #1d1a17; font-weight: 600; border-bottom-color: #ff4d1c; }
    .pane { display: none; }
    .pane.on { display: block; }
    .pane-lead { color: #6b6560; font-size: 14px; line-height: 1.7; margin: 0 0 16px; }
    .pane-lead b { color: #1d1a17; }
    .pane-toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 0 0 12px; }
    .pane-toolbar select, .pane-toolbar input {
      height: 36px; border-radius: 9px; border: 1px solid #d8d4cc; background: #fff; padding: 0 10px; font: inherit;
    }
    .pane-toolbar input { min-width: 210px; }
    .pane-toolbar .spacer { flex: 1; }
    .pane-stat { color: #6b6560; font-size: 13px; }
    .pane-stat b { color: #1d1a17; font-weight: 600; }
    .pane-bars { display: flex; gap: 16px; flex-wrap: wrap; margin: 0 0 8px; font-size: 13px; color: #6b6560; }
    .pane-bars b { color: #1d1a17; }
    .pane-empty { padding: 44px 0; text-align: center; color: #8a837b; }
    .muted { color: #8a837b; }
    .bad { color: #b23b2e; }

    /* 客户在问什么 */
    .ask { display: grid; grid-template-columns: 72px 118px 1fr; gap: 14px; padding: 14px 4px; border-bottom: 1px solid #f1ede5; }
    .ask:hover { background: #fbf9f5; }
    .ask .t { color: #4a443e; font-variant-numeric: tabular-nums; font-size: 13px; }
    .ask .who { font-size: 13px; color: #6b6560; word-break: break-all; }
    .ask .who b { display: block; color: #1d1a17; font-weight: 600; }
    .ask .q { font-size: 15px; line-height: 1.6; color: #1d1a17; word-break: break-word; }
    .ask .meta { margin-top: 5px; font-size: 12px; color: #8a837b; }
    .ask .meta span { margin-right: 12px; }
    .ask.fail .q { color: #b23b2e; }
    .tagf { display: inline-block; padding: 0 7px; border-radius: 999px; background: #f1ede5; color: #6b6560; font-size: 11px; }

    /* 出错记录 */
    .err-tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
    .err-tbl th { text-align: left; font-weight: 500; color: #8a837b; font-size: 12px; padding: 8px 10px; border-bottom: 1px solid #e6e1d8; white-space: nowrap; }
    .err-tbl td { padding: 10px; border-bottom: 1px solid #f1ede5; vertical-align: top; }
    .err-tbl tr:hover td { background: #fbf9f5; }
    .err-tbl .t { white-space: nowrap; color: #4a443e; font-variant-numeric: tabular-nums; }
    .err-tbl .ins, .err-tbl .where { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: #7a736b; white-space: nowrap; }
    .err-tbl .msg { color: #2b2723; line-height: 1.55; word-break: break-word; }
    .err-tbl .msg small { display: block; color: #8a837b; font-size: 12px; margin-top: 3px; }
    .err-tbl .st { display: inline-block; min-width: 34px; text-align: center; padding: 1px 7px; border-radius: 999px; font-size: 11px; background: #f1ede5; color: #6b6560; }
    .err-tbl .st.b5 { background: #fde8e2; color: #c0392b; }
  </style>
</head>
<body>
  <header class="bar">
    <a class="brand" href="/"><span class="mark">▶</span>出片王</a>
    <span class="crumb">账号管理</span>
    <span class="grow"></span>
    <span class="admin" id="who"></span>
    <button class="quiet" id="btnLogout" type="button">退出</button>
  </header>

  <main>
    <section class="deny hidden" id="deny">
      <h1 id="denyTitle">先登录管理员账号</h1>
      <p id="denyText">这个页面只有管理员能用。别人拿到链接也改不了任何东西。</p>
      <button class="primary" id="denyBtn" type="button">去登录</button>
    </section>

    <nav class="admin-tabs hidden" id="tabs" role="tablist">
      <button type="button" role="tab" data-tab="accounts" class="on" aria-selected="true">账号</button>
      <button type="button" role="tab" data-tab="topics" aria-selected="false">客户在问什么</button>
      <button type="button" role="tab" data-tab="errors" aria-selected="false">出错记录</button>
    </nav>

    <div id="app" class="hidden">
      <div class="pane" data-pane="topics"></div>
      <div class="pane" data-pane="errors"></div>
      <section class="pane on" data-pane="accounts">
        <section class="lede">
        <div>
          <h1>账号</h1>
          <p>谁在用、还剩多久、填没填自己的密钥，一眼看完。</p>
        </div>
        <dl class="counts">
          <div><dt>全部</dt><dd id="nAll">0</dd></div>
          <div><dt>在用</dt><dd id="nOn">0</dd></div>
          <div><dt>已停用</dt><dd id="nOff">0</dd></div>
        </dl>
      </section>

      <section class="sheet">
        <h2>开新号</h2>
        <form class="form" id="createForm" autocomplete="off">
          <label class="field"><span>账号</span>
            <input name="username" type="text" placeholder="手机号、邮箱或拼音" required />
          </label>
          <label class="field"><span>备注</span>
            <input name="name" type="text" placeholder="比如：张老师 · 少儿美术" />
          </label>
          <label class="field"><span>初始密码</span>
            <span class="with-action">
              <input name="password" type="password" required placeholder="至少 6 位" />
              <button class="field-action" type="button" id="genPw">随机</button>
            </span>
          </label>
          <label class="field"><span>有效期</span>
            <span class="inline">
              <select name="preset">
                <option value="">永久</option>
                <option value="1m">1 个月</option>
                <option value="3m">3 个月</option>
                <option value="6m">6 个月</option>
                <option value="1y">1 年</option>
                <option value="custom">指定到期日</option>
              </select>
              <input type="date" name="expiresAt" class="hidden" />
              <button class="field-action back hidden" type="button" id="backPreset" title="改回快捷选项">快捷</button>
            </span>
          </label>
          <label class="field"><span>使用方式</span>
            <select name="plan">
              <option value="trial:6">试用 6 次（平台出 AI，客户不用填密钥）</option>
              <option value="trial:12">试用 12 次</option>
              <option value="trial:24">试用 24 次</option>
              <option value="selfkey">自备密钥 · 不限次数</option>
            </select>
          </label>
          <button class="primary" type="submit">开号</button>
        </form>
        <p class="note">开完把账号密码发给客户。试用号登录后直接能用，AI 走平台密钥、按次数限；自备密钥的号由客户自己填 DeepSeek 密钥，不限次数。</p>
      </section>

      <section class="sheet">
        <div class="roster-head">
          <h2>所有账号</h2>
          <span class="spacer"></span>
          <input id="q" type="text" placeholder="搜账号或备注" />
          <span class="count" id="stat"></span>
        </div>
        <div class="roster" id="list"><div class="empty">正在读取…</div></div>
      </section>
      </section>
    </div>
  </main>

  <div id="modalHost"></div>
  <div class="toast" id="toast"></div>
  <script type="module" src="/admin/accounts.js"></script>
</body>
</html>
