<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>账号管理 · 出片王</title>
  <link rel="icon" href="/favicon.svg" />
  <link rel="stylesheet" href="/admin/accounts.css" />
</head>
<body>
  <header class="bar">
    <a class="brand" href="/"><span class="mark">▶</span>出片王</a>
    <span class="crumb">账号管理</span>
    <span class="grow"></span>
    <span class="admin" id="who"></span>
    <button class="quiet" id="btnLogout" type="button">退出</button>
  </header>

  <main>
    <section class="deny hidden" id="deny">
      <h1 id="denyTitle">先登录管理员账号</h1>
      <p id="denyText">这个页面只有管理员能用。别人拿到链接也改不了任何东西。</p>
      <button class="primary" id="denyBtn" type="button">去登录</button>
    </section>

    <div id="app" class="hidden">
      <section class="lede">
        <div>
          <h1>账号</h1>
          <p>谁在用、还剩多久、填没填自己的密钥，一眼看完。</p>
        </div>
        <dl class="counts">
          <div><dt>全部</dt><dd id="nAll">0</dd></div>
          <div><dt>在用</dt><dd id="nOn">0</dd></div>
          <div><dt>已停用</dt><dd id="nOff">0</dd></div>
        </dl>
      </section>

      <section class="sheet">
        <h2>开新号</h2>
        <form class="form" id="createForm" autocomplete="off">
          <label class="field"><span>账号</span>
            <input name="username" type="text" placeholder="手机号、邮箱或拼音" required />
          </label>
          <label class="field"><span>备注</span>
            <input name="name" type="text" placeholder="比如：张老师 · 少儿美术" />
          </label>
          <label class="field"><span>初始密码</span>
            <span class="with-action">
              <input name="password" type="password" required placeholder="至少 6 位" />
              <button class="field-action" type="button" id="genPw">随机</button>
            </span>
          </label>
          <label class="field"><span>有效期</span>
            <span class="inline">
              <select name="preset">
                <option value="">永久</option>
                <option value="1m">1 个月</option>
                <option value="3m">3 个月</option>
                <option value="6m">6 个月</option>
                <option value="1y">1 年</option>
                <option value="custom">指定到期日</option>
              </select>
              <input type="date" name="expiresAt" class="hidden" />
              <button class="field-action back hidden" type="button" id="backPreset" title="改回快捷选项">快捷</button>
            </span>
          </label>
          <button class="primary" type="submit">开号</button>
        </form>
        <p class="note">开完把账号密码发给客户。他第一次登录要填自己的 DeepSeek 密钥，写文案只花他自己的额度。</p>
      </section>

      <section class="sheet">
        <div class="roster-head">
          <h2>所有账号</h2>
          <span class="spacer"></span>
          <input id="q" type="text" placeholder="搜账号或备注" />
          <span class="count" id="stat"></span>
        </div>
        <div class="roster" id="list"><div class="empty">正在读取…</div></div>
      </section>
    </div>
  </main>

  <div id="modalHost"></div>
  <div class="toast" id="toast"></div>
  <script type="module" src="/admin/accounts.js"></script>
</body>
</html>
