<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>账号管理 · 出片王</title>
  <link rel="icon" href="/favicon.svg" />
  <link rel="stylesheet" href="/admin/accounts.css" />
</head>
<body>
  <header>
    <a class="logo" href="/"><i>▶</i>出片王</a>
    <span class="sep">/</span>
    <strong>账号管理</strong>
    <span class="grow"></span>
    <span class="who" id="who"></span>
    <button class="ghost mini" id="btnLogout" type="button">退出登录</button>
  </header>

  <main>
    <section class="card">
      <h2>开一个新号</h2>
      <form class="new" id="createForm" autocomplete="off">
        <input name="username" placeholder="账号（字母数字，2–32 位）" required />
        <input name="name" placeholder="备注 / 姓名（如：张老师）" />
        <input name="password" type="password" placeholder="初始密码（至少 6 位，别用纯数字）" required />
        <input name="expiresAt" type="date" title="到期日（不填就是永久）" />
        <button class="pri" type="submit">开号</button>
      </form>
      <p class="hint">开好后把「账号 + 初始密码」发给客户。他登录后能自己改密码、填自己的 DeepSeek 密钥；你能随时停用、续期。</p>
    </section>

    <section class="card">
      <div class="head">
        <h2>所有账号</h2>
        <span class="grow"></span>
        <input id="q" type="text" placeholder="搜账号 / 姓名" />
        <span class="stat" id="stat"></span>
      </div>
      <div class="list" id="list"><div class="empty">正在读取…</div></div>
    </section>
  </main>
  <div class="toast" id="toast"></div>
  <script type="module" src="/admin/accounts.js"></script>
</body>
</html>
