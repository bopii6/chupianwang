<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>我的作品 · 出片王</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <!-- 界面文字用系统字体，不在这页加载中文字体分片（出片时会按需加载） -->
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/works.css" />
</head>
<body class="works-page">
  <header class="topbar">
    <a class="brand" href="/"><span class="logo"><svg viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></svg></span>出片王</a>
    <nav class="topnav">
      <a href="/">制作台</a>
      <a href="/admin/copy.html">文案库</a>
      <a href="/works.html">我的作品</a>
    </nav>
    <div class="wk-head-actions">
      <button class="wk-btn primary" id="btnImport" type="button">导入视频</button>
      <button class="wk-btn" id="btnLive" type="button">直播模式</button>
      <input type="file" id="fileInput" accept="video/mp4" multiple hidden />
    </div>
  </header>

  <main class="wk-main">
    <div class="wk-head">
      <div>
        <h1>我的作品</h1>
        <p id="wkSub">只显示你自己账号下的成片，别人看不到。</p>
      </div>
      <div class="wk-tools">
        <input type="search" id="search" placeholder="搜标题…" autocomplete="off" />
        <select id="sort">
          <option value="new">最新在前</option>
          <option value="old">最早在前</option>
        </select>
      </div>
    </div>

    <div class="wk-empty hidden" id="empty">
      <h2>还没有作品</h2>
      <p>
        每次点「生成视频」，导出的成片会自动存到你自己账号下，就在这里。<br />
        手里已有的 MP4，可以直接拖到这个页面上，或者点右上角「导入视频」。<br />
        这个列表只有你自己看得到，别的账号看不到。
      </p>
      <button class="wk-btn primary" id="btnImport2" type="button">选视频导入</button>
    </div>

    <div class="wk-filters" id="wkFilters"></div>

    <div class="wk-grid" id="grid"></div>
  </main>

  <!-- 单条播放 -->
  <div class="wk-player hidden" id="player">
    <button class="wk-close" id="playerClose" type="button" aria-label="关闭">×</button>
    <div class="wk-player-box">
      <video id="playerVideo" controls playsinline></video>
      <div class="wk-player-bar">
        <b id="playerTitle"></b>
        <button class="wk-btn" id="playerPrev" type="button">上一条</button>
        <button class="wk-btn" id="playerNext" type="button">下一条</button>
      </div>
    </div>
  </div>

  <!-- 直播模式：整屏轮播 -->
  <div class="wk-live hidden" id="live">
    <button class="wk-close" id="liveClose" type="button" aria-label="退出直播模式">×</button>
    <div class="wk-player-box">
      <video id="liveVideo" playsinline></video>
      <div class="wk-live-bar">
        <b id="liveTitle"></b>
        <span class="wk-live-idx" id="liveIdx"></span>
        <button class="wk-btn" id="livePrev" type="button">上一条</button>
        <button class="wk-btn" id="liveNext" type="button">下一条</button>
      </div>
    </div>
  </div>

  <div class="wk-toast" id="toast"></div>

  <footer class="icp-foot" aria-label="网站备案信息">
    <nav class="icp-sites" aria-label="站点导航">
      <span class="icp-site is-current" aria-current="page">出片王</span>
      <span class="icp-dot" aria-hidden="true">·</span>
      <a class="icp-site" href="https://course.getcut.cn">课程</a>
      <span class="icp-dot" aria-hidden="true">·</span>
      <a class="icp-site" href="https://bot.getcut.cn">课件</a>
      <span class="icp-dot" aria-hidden="true">·</span>
      <a class="icp-site" href="https://lab.getcut.cn">实验</a>
    </nav>
    <span class="icp-sep" aria-hidden="true">·</span>
    <a class="icp-beian" href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">京ICP备2025152536号-3</a>
  </footer>

  <script type="module" src="/nav.js"></script>
  <script src="/works.js"></script>
</body>
</html>
